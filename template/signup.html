<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | NAME - Blue-Collar Service Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2D5BFF',
              textGrey: '#4A4F59',
              heading: '#0F1115',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #fafbfd;
      }

      .glass-nav {
        backdrop-filter: blur(18px);
        background: rgba(255, 255, 255, 0.8);
        border-bottom: 1px solid rgba(13, 19, 33, 0.08);
      }

      .hero-gradient-bg {
        background: linear-gradient(135deg, #f0f4ff 0%, #fef7f5 50%, #f5fbfa 100%);
        position: relative;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(45, 91, 255, 0.1);
        box-shadow: 0 8px 32px rgba(45, 91, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
        animation: cardFadeIn 0.8s ease-out;
      }

      @keyframes cardFadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-primary {
        background: linear-gradient(135deg, #2D5BFF 0%, #3D6BFF 100%) !important;
        box-shadow: 0 4px 16px rgba(45, 91, 255, 0.3) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: white !important;
        border: none !important;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(45, 91, 255, 0.4) !important;
        background: linear-gradient(135deg, #2D5BFF 0%, #3D6BFF 100%) !important;
      }

      .btn-primary:disabled {
        opacity: 0.5 !important;
        cursor: not-allowed !important;
      }

      .input-field {
        border: 1.5px solid rgba(45, 91, 255, 0.15);
        transition: all 0.3s ease;
      }

      .input-field:focus {
        outline: none;
        border-color: #2D5BFF;
        box-shadow: 0 0 0 3px rgba(45, 91, 255, 0.1);
      }
    </style>
  </head>
  <body class="bg-white text-heading">
    <header class="fixed top-0 inset-x-0 z-50 glass-nav">
      <div class="max-w-[80vw] mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-2xl bg-primary/15 flex items-center justify-center">
            <div class="w-4 h-4 rounded-full bg-primary"></div>
          </div>
          <span class="font-semibold text-lg tracking-tight text-heading">NAME</span>
        </div>
        <div class="hidden lg:flex items-center space-x-4">
          <a href="index.html" class="px-5 py-2 rounded-xl text-textGrey font-medium hover:text-heading">
            Back to Home
          </a>
          <a href="login.html" class="px-5 py-2 rounded-xl border border-primary text-primary font-semibold">
            Login
          </a>
        </div>
        <button id="mobileToggle" class="lg:hidden w-10 h-10 rounded-xl border border-black/10 flex flex-col justify-center items-center space-y-1.5">
          <span class="block w-6 h-0.5 bg-heading"></span>
          <span class="block w-6 h-0.5 bg-heading"></span>
          <span class="block w-6 h-0.5 bg-heading"></span>
        </button>
      </div>
      <div id="mobileMenu" class="lg:hidden bg-white border-t border-black/5 shadow-lg origin-top scale-y-0 opacity-0 absolute left-0 right-0 top-full overflow-hidden transform-gpu transition-transform duration-200">
        <div class="px-6 py-4 space-y-4 text-textGrey font-medium">
          <a href="index.html" class="block">Back to Home</a>
          <a href="login.html" class="block">Login</a>
        </div>
      </div>
    </header>

    <main class="pt-24 min-h-screen hero-gradient-bg flex items-center justify-center px-6 py-12">
      <div class="w-full max-w-md">
        <!-- Signup Card -->
        <div class="glass-card rounded-3xl p-8 lg:p-10 space-y-6 shadow-lg">
          <div class="text-center space-y-3">
            <h1 class="text-3xl lg:text-4xl font-bold text-gray-900">
              Create your account
            </h1>
            <p class="text-gray-600">
              Join thousands of professionals and customers
            </p>
          </div>

          <form class="space-y-5" id="signupForm">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label for="firstName" class="block text-sm font-semibold text-gray-700">
                  First name
                </label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  required
                  placeholder="John"
                  class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
                />
              </div>
              <div class="space-y-2">
                <label for="lastName" class="block text-sm font-semibold text-gray-700">
                  Last name
                </label>
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  required
                  placeholder="Doe"
                  class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="email" class="block text-sm font-semibold text-gray-700">
                Email address
              </label>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="you@example.com"
                class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </div>

            <div class="space-y-2">
              <label for="phone" class="block text-sm font-semibold text-gray-700">
                Phone number
              </label>
              <input
                type="tel"
                id="phone"
                name="phone"
                required
                placeholder="+91 98765 43210"
                class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </div>

            <div class="space-y-2">
              <label for="area" class="block text-sm font-semibold text-gray-700">
                Area
              </label>
              <input
                type="text"
                id="area"
                name="area"
                required
                placeholder="Enter your area/locality"
                class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-2">
                <label for="city" class="block text-sm font-semibold text-gray-700">
                  City
                </label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  required
                  placeholder="Enter your city"
                  class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
                />
              </div>
              <div class="space-y-2">
                <label for="state" class="block text-sm font-semibold text-gray-700">
                  State
                </label>
                <input
                  type="text"
                  id="state"
                  name="state"
                  required
                  placeholder="Enter your state"
                  class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-semibold text-gray-700">
                Password
              </label>
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Create a strong password"
                class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
              <p class="text-xs text-gray-500 mt-1">
                Must be at least 8 characters with letters and numbers
              </p>
            </div>

            <div class="space-y-2">
              <label for="confirmPassword" class="block text-sm font-semibold text-gray-700">
                Confirm password
              </label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                required
                placeholder="Re-enter your password"
                class="input-field w-full rounded-2xl px-5 py-4 text-gray-700 bg-white font-medium placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </div>

            <div class="flex items-start space-x-2">
              <input
                type="checkbox"
                id="terms"
                name="terms"
                required
                class="w-4 h-4 mt-1 rounded border-gray-300 text-primary focus:ring-primary"
              />
              <label for="terms" class="text-sm text-gray-600">
                I agree to the
                <a href="#" class="text-primary font-medium hover:text-indigo-700">Terms of Service</a>
                and
                <a href="#" class="text-primary font-medium hover:text-indigo-700">Privacy Policy</a>
              </label>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="btn-primary w-full px-6 py-4 rounded-2xl font-semibold text-lg transition-all duration-300"
              style="background: linear-gradient(135deg, #2D5BFF 0%, #3D6BFF 100%); color: white; border: none; box-shadow: 0 4px 16px rgba(45, 91, 255, 0.3);"
            >
              <span id="submitText" style="color: white;">Create Account</span>
              <span id="submitLoader" class="hidden" style="color: white;">Creating account...</span>
            </button>
            <div id="errorMessage" class="hidden text-red-600 text-sm mt-2 text-center"></div>
            <div id="successMessage" class="hidden text-green-600 text-sm mt-2 text-center"></div>
          </form>

          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4 bg-white text-gray-500">Or sign up with</span>
            </div>
          </div>

          <button
            type="button"
            class="w-full flex items-center justify-center space-x-2 px-4 py-3 rounded-2xl border border-gray-200 bg-white font-medium text-gray-700 hover:bg-gray-50 transition-colors"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <div class="text-center pt-4">
            <p class="text-sm text-gray-600">
              Already have an account?
              <a href="login.html" class="text-primary font-semibold hover:text-indigo-700">
                Sign in
              </a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </body>
</html>
